    <title>个人工作站</title>
    <style>html.dark{background:#181C24}</style>
    <script>
      // 主题预置：React 挂载前设置 dark 类，避免暗色用户启动时闪白（仅 浅色/深色 两档，旧的 system 值按浅色处理）
      try {
        var saved = JSON.parse(localStorage.getItem('ws-ui') || '{}');
        if (saved.state && saved.state.theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* 忽略 */ }
    </script>
