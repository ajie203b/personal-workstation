name: Update intelligence ranking

# 每天抓一次 Artificial Analysis 智能指数：
# - public/intelligence.json：结构化排名（官方 API 或公开榜单页）
# - public/intelligence/chart.png：官网首屏图表的浏览器截图（Recharts 无稳定图片地址）
# 应用运行时优先读 main 上的新 JSON / 新图表，离线回退内置版本，
# 因此网页版、桌面版与安卓包都不用重新发版也能拿到新榜单。
on:
  schedule:
    - cron: '17 5 * * *' # UTC 05:17 = 北京时间 13:17
  workflow_dispatch:
    inputs:
      force_chart:
        description: '强制重新截取官方图表'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: intelligence
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fetch ranking
        run: node scripts/fetch-intelligence.mjs
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}

      # JSON 先单独提交：后面浏览器截图失败时，排名数据仍能正常更新
      - name: Commit ranking if changed
        run: |
          # 首次运行时文件还是未跟踪状态，git diff 看不出变化，必须看 status
          if [ -z "$(git status --porcelain -- public/intelligence.json)" ]; then
            echo "榜单没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/intelligence.json
          git commit -m "data: 每日更新模型智能排名"
          git push

      - name: Install Playwright Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium

      - name: Fetch official chart
        env:
          FORCE_CHART_SCREENSHOT: ${{ inputs.force_chart && '1' || '' }}
        run: node scripts/fetch-intelligence-chart.mjs

      - name: Commit chart if changed
        run: |
          if [ -z "$(git status --porcelain -- public/intelligence/chart.png scripts/intelligence-chart.json)" ]; then
            echo "官方图表没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/intelligence/chart.png scripts/intelligence-chart.json
          git commit -m "data: 每日更新官方模型图表"
          git push
