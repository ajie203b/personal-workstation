name: Desktop (Windows)

# Windows 桌面版（Tauri）安装包：本机不用装 Rust，全在这里打。
# - 手动运行（Actions → Desktop (Windows) → Run workflow）：产物在本次运行的 Artifacts 里
# - 推 v* 标签：额外把安装包挂到同名 Release 上，和 APK 放一起
# - PR 改到桌面壳时也打一次，产物同样在 Artifacts 里，合并前就能装来试
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Kairos-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
