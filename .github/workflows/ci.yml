name: CI

# 每次提交都跑一遍类型检查、单测与构建。
# 之前仓库里只有排行榜更新工作流，改动是否弄坏构建只能等发版时才发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 锁文件是在 Windows 上生成的，里面没有 @rollup/rollup-linux-x64-gnu 这个平台包；
      # npm ci 之后 vitest / vite build 会直接 MODULE_NOT_FOUND（CI 从加上那天就一直红在这里）。
      # 按本地安装的 rollup 版本补装对应二进制，--no-save 不动 package.json / 锁文件。
      - name: Ensure rollup native binary
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      # 榜单抓取脚本的解析逻辑（字段命名坑、RSC 拆包）用 node 自带 test runner 跑
      - name: Script tests
        run: npm run test:scripts

      # 构建放最后：它内部还会再跑一次 tsc，但那一步失败时前面的单测结果已经可见
      - name: Build
        run: npm run build
