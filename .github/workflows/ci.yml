name: CI

# 每次提交都跑一遍类型检查、单测与构建。
# 之前仓库里只有排行榜更新工作流，改动是否弄坏构建只能等发版时才发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 不用 npm ci：Windows 上生成的锁文件在 Linux 上装不全原生平台包
      # （npm/cli#4828，rollup / lightningcss / @tailwindcss/oxide 会依次 MODULE_NOT_FOUND）。
      # 删掉锁文件做一次干净解析，锁文件仍由本机 npm install 维护。
      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      # 榜单抓取脚本的解析逻辑（字段命名坑、RSC 拆包）用 node 自带 test runner 跑
      - name: Script tests
        run: npm run test:scripts

      # 构建放最后：它内部还会再跑一次 tsc，但那一步失败时前面的单测结果已经可见
      - name: Build
        run: npm run build
