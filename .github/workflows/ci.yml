name: CI

# 每次提交都跑一遍类型检查、单测与构建。
# 之前仓库里只有排行榜更新工作流，改动是否弄坏构建只能等发版时才发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 锁文件是在 Windows 上生成的，里面没有 linux 平台的 optional 依赖；
      # npm ci 之后 vitest（rollup）、vite build（lightningcss / esbuild）都会 MODULE_NOT_FOUND。
      # 按本地已安装的版本补装对应二进制，--no-save 不动 package.json 与锁文件。
      - name: Ensure linux native binaries
        run: |
          ARGS=()
          for SPEC in "rollup:@rollup/rollup-linux-x64-gnu" "lightningcss:lightningcss-linux-x64-gnu" "esbuild:@esbuild/linux-x64"; do
            DIR="${SPEC%%:*}"
            PKG="${SPEC#*:}"
            VER=$(node -p "require('./node_modules/$DIR/package.json').version" 2>/dev/null || true)
            if [ -n "$VER" ]; then ARGS+=("$PKG@$VER"); fi
          done
          printf '补装：%s\n' "${ARGS[*]}"
          npm install --no-save --no-audit --no-fund "${ARGS[@]}"

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      # 榜单抓取脚本的解析逻辑（字段命名坑、RSC 拆包）用 node 自带 test runner 跑
      - name: Script tests
        run: npm run test:scripts

      # 构建放最后：它内部还会再跑一次 tsc，但那一步失败时前面的单测结果已经可见
      - name: Build
        run: npm run build
